<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>植物配置MVP v4</title>
<style>
body{font-family:sans-serif;margin:0;padding:10px;background:#f5f5f5;}
.stage{position:relative;height:300px;background:#eee;border-radius:10px;overflow:hidden;}
#room{width:100%;height:100%;object-fit:contain;}
#plant{position:absolute;width:30%;left:50%;top:50%;transform:translate(-50%,-50%);}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
.card{background:#fff;padding:10px;border-radius:10px;cursor:pointer;text-align:center;}
.card img{width:100%;height:80px;object-fit:contain;}
.sel{border:2px solid green;}
.info{font-size:12px;}
.result{background:#fff;margin-top:10px;padding:10px;border-radius:10px;}
</style>
</head>
<body>

<h3>植物配置MVP</h3>
<input type="file" id="upload">

<div class="stage">
<img id="room">
<img id="plant">
</div>

<div class="grid" id="grid"></div>

<div class="result" id="result"></div>

<script>

const plants = [
{
name:"モンステラ",
img:"assets/monstera.png",
height:"50〜150cm",
type:"横に広がる"
},
{
name:"ケンチャヤシ",
img:"assets/kentia.png",
height:"100〜200cm",
type:"上に伸びる"
},
{
name:"フィカス",
img:"assets/ficus.png",
height:"80〜180cm",
type:"上に伸びる"
},
{
name:"ポトス",
img:"assets/pothos.png",
height:"20〜100cm",
type:"垂れる（ツル性）"
}
];

let current = plants[0];

function render(){
const g=document.getElementById("grid");
g.innerHTML="";
plants.forEach(p=>{
const d=document.createElement("div");
d.className="card";
d.innerHTML=`
<img src="${p.img}">
<b>${p.name}</b>
<div class="info">高さ:${p.height}</div>
<div class="info">タイプ:${p.type}</div>
`;
d.onclick=()=>{
current=p;
document.getElementById("plant").src=p.img;
update();
render();
};
if(p===current)d.classList.add("sel");
g.appendChild(d);
});
}

function update(){
document.getElementById("result").innerHTML=`
<b>${current.name}</b><br>
高さ:${current.height}<br>
成長:${current.type}
`;
}

document.getElementById("upload").onchange=e=>{
const r=new FileReader();
r.onload=()=>{document.getElementById("room").src=r.result;}
r.readAsDataURL(e.target.files[0]);
};

document.getElementById("plant").src=current.img;
render();
update();

</script>

</body>
</html>
